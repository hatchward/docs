<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }} — {{ site.description | split: "—" | first | strip }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.url == '/' %}{{ site.description }}{% else %}{{ page.title }} — {{ site.title }} documentation.{% endif %}">
<meta name="color-scheme" content="light dark">

<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/newsreader-normal-400-600.woff2' | relative_url }}">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ '/assets/fonts/martian-mono-normal-600.woff2' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
